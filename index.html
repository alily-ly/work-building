<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>广宁县全域土地综合整治项目系统平台</title>
    <script>
        window._AMapSecurityConfig = {
            securityJsCode: 'YOUR_SECURITY_CONFIG'
        }
    </script>
    <script src="https://webapi.amap.com/loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0f16;
            --bg-secondary: rgba(10, 18, 30, 0.92);
            --bg-panel: rgba(13, 22, 38, 0.88);
            --border-primary: rgba(0, 212, 255, 0.25);
            --border-glow: rgba(0, 212, 255, 0.5);
            --text-primary: #e8f4f8;
            --text-secondary: #8ba3b5;
            --accent-cyan: #00d4ff;
            --accent-blue: #0066ff;
            --accent-gold: #f0a500;
            --accent-green: #00e5a0;
            --danger: #ff4757;
            --panel-width: 430px;
            --header-height: 72px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* 背景网格纹理 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* 顶部导航栏 */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            z-index: 1000;
            background: linear-gradient(180deg, rgba(6, 12, 22, 0.98) 0%, rgba(6, 12, 22, 0.85) 70%, transparent 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            pointer-events: none;
        }

        .header > * {
            pointer-events: auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo {
            width: 44px;
            height: 44px;
            border: 2px solid var(--accent-cyan);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 212, 255, 0.08);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.25);
        }

        .brand-logo svg {
            width: 26px;
            height: 26px;
            fill: var(--accent-cyan);
        }

        .brand-text h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff 0%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-text p {
            font-size: 11px;
            color: var(--text-secondary);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 2px;
            font-family: 'Orbitron', sans-serif;
        }

        /* 搜索区域 */
        .search-area {
            position: relative;
            width: 420px;
        }

        .search-box {
            width: 100%;
            height: 44px;
            background: var(--bg-panel);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            padding: 0 48px 0 18px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(12px);
        }

        .search-box:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .search-box::placeholder {
            color: var(--text-secondary);
        }

        .search-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-cyan);
            pointer-events: none;
        }

        .search-results {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: var(--bg-panel);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            max-height: 320px;
            overflow-y: auto;
            display: none;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .search-results.active {
            display: block;
        }

        .search-result-item {
            padding: 14px 18px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:hover {
            background: rgba(0, 212, 255, 0.08);
        }

        .search-result-item .name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .search-result-item .meta {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            height: 40px;
            padding: 0 20px;
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            color: var(--accent-cyan);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .btn:hover {
            background: rgba(0, 212, 255, 0.18);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .btn.active {
            background: rgba(0, 212, 255, 0.25);
            border-color: var(--accent-cyan);
        }

        /* 地图容器 */
        #map {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* 右侧详情面板 */
        .detail-panel {
            position: fixed;
            top: var(--header-height);
            right: 0;
            width: var(--panel-width);
            bottom: 0;
            background: linear-gradient(180deg, rgba(8, 16, 28, 0.96) 0%, rgba(6, 12, 22, 0.94) 100%);
            border-left: 1px solid var(--border-primary);
            z-index: 900;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(20px);
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.4);
        }

        .detail-panel.open {
            transform: translateX(0);
        }

        .panel-header {
            padding: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
        }

        .panel-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .panel-close:hover {
            background: rgba(255, 71, 87, 0.15);
            border-color: var(--danger);
            color: var(--danger);
        }

        .panel-title {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.4;
            padding-right: 40px;
            color: #fff;
        }

        .panel-address {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .panel-address svg {
            width: 14px;
            height: 14px;
            fill: var(--accent-cyan);
        }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .panel-body::-webkit-scrollbar {
            width: 6px;
        }

        .panel-body::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }

        .panel-body::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.25);
            border-radius: 3px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-cyan);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 16px;
            background: linear-gradient(180deg, var(--accent-cyan), var(--accent-blue));
            border-radius: 2px;
        }

        /* 数据字段网格 */
        .data-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }

        .data-card {
            background: rgba(0, 212, 255, 0.04);
            border: 1px solid rgba(0, 212, 255, 0.12);
            border-radius: 10px;
            padding: 14px;
            transition: all 0.3s ease;
        }

        .data-card:hover {
            background: rgba(0, 212, 255, 0.08);
            border-color: rgba(0, 212, 255, 0.25);
            transform: translateY(-2px);
        }

        .data-card .label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .data-card .value {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .data-card .value.highlight {
            color: var(--accent-gold);
        }

        .data-card .value.cyan {
            color: var(--accent-cyan);
        }

        .data-card .value.green {
            color: var(--accent-green);
        }

        /* 文本区块 */
        .text-block {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 28px;
        }

        .text-block p {
            font-size: 13px;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        /* 图片画廊 */
        .gallery-section {
            margin-bottom: 28px;
        }

        .gallery-main {
            width: 100%;
            height: 200px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(0, 212, 255, 0.15);
            position: relative;
            background: rgba(0, 0, 0, 0.3);
        }

        .gallery-main img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-main:hover img {
            transform: scale(1.05);
        }

        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .gallery-nav:hover {
            background: rgba(0, 212, 255, 0.8);
            border-color: var(--accent-cyan);
        }

        .gallery-nav.prev {
            left: 10px;
        }

        .gallery-nav.next {
            right: 10px;
        }

        .gallery-thumbs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .gallery-thumb {
            aspect-ratio: 1;
            border-radius: 6px;
            overflow: hidden;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(0, 0, 0, 0.3);
        }

        .gallery-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-thumb.active {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.3);
        }

        .gallery-thumb:hover {
            transform: scale(1.05);
        }

        .gallery-counter {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: #fff;
        }

        /* 图片占位 */
        .image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.05) 0%, rgba(0, 102, 255, 0.05) 100%);
        }

        .image-placeholder svg {
            width: 40px;
            height: 40px;
            fill: rgba(0, 212, 255, 0.3);
            margin-bottom: 8px;
        }

        .image-placeholder span {
            font-size: 12px;
        }

        /* 数据看板 */
        .dashboard {
            position: fixed;
            left: 24px;
            bottom: 24px;
            width: 520px;
            max-height: calc(100vh - var(--header-height) - 48px);
            background: linear-gradient(180deg, rgba(8, 16, 28, 0.95) 0%, rgba(6, 12, 22, 0.92) 100%);
            border: 1px solid var(--border-primary);
            border-radius: 16px;
            z-index: 800;
            transform: translateY(calc(100% + 40px));
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .dashboard.open {
            transform: translateY(0);
        }

        .dashboard-header {
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .dashboard-title {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dashboard-title::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent-cyan);
        }

        .dashboard-close {
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .dashboard-close:hover {
            background: rgba(255, 71, 87, 0.15);
            border-color: var(--danger);
            color: var(--danger);
        }

        .dashboard-body {
            padding: 20px;
            overflow-y: auto;
            max-height: calc(100vh - var(--header-height) - 130px);
        }

        .dashboard-body::-webkit-scrollbar {
            width: 6px;
        }

        .dashboard-body::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.25);
            border-radius: 3px;
        }

        .stat-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.12);
            border-radius: 10px;
            padding: 14px 10px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 20px;
            font-weight: 900;
            color: var(--accent-cyan);
            font-family: 'Orbitron', sans-serif;
        }

        .stat-card .number.gold {
            color: var(--accent-gold);
        }

        .stat-card .number.green {
            color: var(--accent-green);
        }

        .stat-card .label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        .chart-container {
            height: 200px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 10px;
        }

        .town-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .town-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .town-item:hover {
            background: rgba(0, 212, 255, 0.08);
            border-color: rgba(0, 212, 255, 0.2);
        }

        .town-name {
            font-size: 13px;
            color: var(--text-primary);
        }

        .town-count {
            font-size: 12px;
            color: var(--accent-cyan);
            font-weight: 600;
        }

        /* ============================================================
           简化标记样式（编号圆形 + 名称标签）
           ============================================================ */
        .map-marker-simple {
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .marker-dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--marker-color, #00d4ff);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px var(--marker-color, #00d4ff),
                        0 2px 8px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.9);
            transition: all 0.3s ease;
            position: relative;
        }

        .marker-dot::before {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border-radius: 50%;
            border: 1px solid var(--marker-color, #00d4ff);
            opacity: 0.4;
            animation: marker-pulse 2.5s ease-out infinite;
        }

        @keyframes marker-pulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .marker-num {
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            font-family: 'DIN Alternate', 'Roboto', sans-serif;
        }

        .marker-name {
            margin-top: 4px;
            background: rgba(5, 15, 25, 0.85);
            color: #e0f0ff;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 3px;
            white-space: nowrap;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 1px solid rgba(0, 212, 255, 0.2);
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        .map-marker-simple.hover .marker-dot {
            transform: scale(1.25);
            box-shadow: 0 0 20px var(--marker-color, #00d4ff),
                        0 4px 12px rgba(0,0,0,0.6);
        }

        .map-marker-simple.hover .marker-name {
            max-width: 300px;
            white-space: normal;
            background: rgba(5, 15, 25, 0.95);
            border-color: var(--marker-color, #00d4ff);
        }

        /* 旧标记样式（保留兼容，不再使用） */
        .map-marker {
            position: relative;
            cursor: pointer;
        }

        .marker-pulse {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 212, 255, 0.3);
            animation: pulse 2s ease-out infinite;
        }

        .marker-pulse::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 1px solid rgba(0, 212, 255, 0.3);
            animation: pulse-ring 2s ease-out infinite;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }

        @keyframes pulse-ring {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
        }

        .marker-thumb {
            position: relative;
            width: 48px;
            height: 48px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.5);
        }

        .marker-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .marker-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
        }

        /* 标记标签 */
        .marker-label {
            position: absolute;
            top: 56px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            color: #fff;
            white-space: nowrap;
            border: 1px solid rgba(0, 212, 255, 0.3);
            backdrop-filter: blur(4px);
        }

        /* 自定义信息窗体 */
        .amap-info-window {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* 加载状态 */
        .loading-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

        // ============================================================
        // 全局状态
        // ============================================================
        let map = null;
        let polygonsByName = {};     // { name: [AMap.Polygon, ...] }
        let polygonList = [];        // 所有 polygon 的扁平数组
        let fenceInfoWindow = null;  // 用于地块点击的 InfoWindow
        let currentProjectId = null;
        let typeChart = null;

        // ============================================================
        // 17 种项目颜色（深色科技风）
        // ============================================================
        const NAME_COLORS = [
            '#00d4ff', '#00ff88', '#ffaa00', '#ff4488', '#a855f7',
            '#06b6d4', '#22c55e', '#f59e0b', '#ec4899', '#3b82f6',
            '#14b8a6', '#eab308', '#f43f5e', '#6366f1', '#84cc16',
            '#fb923c', '#d946ef'
        ];

        // 根据项目名称的首出现顺序，分配颜色并分组
        function buildFenceGroups() {
            const groups = {};
            const nameList = [];
            ALL_FENCES.forEach(f => {
                if (!groups[f.name]) {
                    groups[f.name] = [];
                    nameList.push(f.name);
                }
                groups[f.name].push(f);
            });
            const nameColors = {};
            nameList.forEach((name, i) => {
                nameColors[name] = NAME_COLORS[i % NAME_COLORS.length];
            });
            return { groups, nameList, nameColors };
        }

        // 面积格式化
        function formatArea(m2) {
            const mu = m2 / 666.67;
            if (m2 >= 1000000) return (m2/1000000).toFixed(2) + ' km² / ' + mu.toFixed(1) + ' 亩';
            if (m2 >= 10000) return (m2/10000).toFixed(2) + ' 万㎡ / ' + mu.toFixed(1) + ' 亩';
            return Math.round(m2).toLocaleString() + ' ㎡ / ' + mu.toFixed(1) + ' 亩';
        }

        // ============================================================
        // 渲染所有围栏 Polygon
        // ============================================================
        function renderFences(groups, nameColors) {
            clearAllPolygons();

            const isMobile = window.innerWidth <= 768;
            const strokeWeight = isMobile ? 1.5 : 3;
            const fillOpacity = isMobile ? 0.12 : 0.18;

            const bounds = map.getBounds();

            Object.entries(groups).forEach(([name, fences]) => {
                const color = nameColors[name];
                const r = parseInt(color.slice(1,3), 16);
                const g = parseInt(color.slice(3,5), 16);
                const b = parseInt(color.slice(5,7), 16);

                const groupPolygons = [];
                fences.forEach(f => {
                    if (!f.boundary || f.boundary.length < 3) return;

                    const center = f.center;
                    // 移动端：只渲染视野内的围栏
                    if (isMobile && center && bounds) {
                        const sw = bounds.getSouthWest();
                        const ne = bounds.getNorthEast();
                        if (center[0] < sw.getLng() || center[0] > ne.getLng() ||
                            center[1] < sw.getLat() || center[1] > ne.getLat()) {
                            return; // 不在视野内
                        }
                    }

                    const polygon = new AMap.Polygon({
                        path: f.boundary,
                        fillColor: `rgba(${r},${g},${b},${fillOpacity})`,
                        strokeColor: color,
                        strokeWeight: strokeWeight,
                        strokeOpacity: 1.0,
                        fillOpacity: 0.85,
                        strokeStyle: 'solid',
                        cursor: 'pointer',
                        zIndex: 50,
                        extData: f
                    });

                    polygon.on('click', () => {
                        showFenceInfoWindow(f, color);
                    });

                    map.add(polygon);
                    groupPolygons.push(polygon);
                    polygonList.push(polygon);
                });

                polygonsByName[name] = groupPolygons;
            });
        }

        function clearAllPolygons() {
            polygonList.forEach(p => map.remove(p));
            polygonList = [];
            polygonsByName = {};
        }

        // 移动端视野变化时重绘（性能优化）
        function setupMobileViewRefresh(groups, nameColors) {
            let refreshTimer = null;
            const refresh = () => {
                if (refreshTimer) clearTimeout(refreshTimer);
                refreshTimer = setTimeout(() => {
                    renderFences(groups, nameColors);
                    refreshFilterVisibility();
                }, 400);
            };
            map.on('moveend', refresh);
            map.on('zoomend', refresh);
        }

        // ============================================================
        // 地块 InfoWindow
        // ============================================================
        function showFenceInfoWindow(fence, color) {
            if (!fenceInfoWindow) {
                fenceInfoWindow = new AMap.InfoWindow({
                    isCustom: true,
                    closeWhenClickMap: true,
                    autoMove: true,
                    offset: new AMap.Pixel(0, -10)
                });
            }

            const content = `
                <div class="fence-infowindow">
                    <div class="fi-title" style="color:${color};text-shadow:0 0 8px ${color}44;">${fence.name}</div>
                    <div class="fi-row"><span class="fi-label">地块序号</span><span class="fi-value">${fence.serial || fence.id}</span></div>
                    <div class="fi-row"><span class="fi-label">地块面积</span><span class="fi-value highlight">${formatArea(fence.area_m2)}</span></div>
                </div>
            `;

            fenceInfoWindow.setContent(content);
            fenceInfoWindow.open(map, fence.center);
        }

        // ============================================================
        // 项目筛选区渲染
        // ============================================================
        let filterVisible = {}; // { name: true/false }
        let globalNameColors = {}; // 全局颜色映射

        function renderProjectFilter(nameList, groups, nameColors) {
            const container = document.getElementById('projectFilter');
            if (!container) return;

            const rows = nameList.map(name => {
                const color = nameColors[name];
                const cnt = groups[name].length;
                const area = groups[name].reduce((s, f) => s + f.area_m2, 0);
                filterVisible[name] = true;

                return `
                <label class="filter-item" data-name="${name}">
                    <input type="checkbox" checked data-filter="${name}">
                    <span class="filter-dot" style="background:${color};color:${color};"></span>
                    <span class="filter-name">${name}</span>
                    <span class="filter-stats">${cnt}块 · ${formatAreaCompact(area)}</span>
                </label>`;
            }).join('');

            container.innerHTML = rows;

            container.querySelectorAll('input[data-filter]').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const name = e.target.dataset.filter;
                    filterVisible[name] = e.target.checked;
                    applyFilterVisibility();
                });
            });
        }

        function formatAreaCompact(m2) {
            if (m2 >= 1000000) return (m2/1000000).toFixed(1) + 'km²';
            if (m2 >= 10000) return (m2/10000).toFixed(1) + '万㎡';
            return Math.round(m2) + '㎡';
        }

        function applyFilterVisibility() {
            Object.entries(polygonsByName).forEach(([name, polys]) => {
                const visible = !!filterVisible[name];
                polys.forEach(p => p.setOptions({ visible: visible }));
            });
        }

        function refreshFilterVisibility() {
            // 重新检查每个 polygon 的可见性（移动端重绘后重新应用）
            Object.entries(polygonsByName).forEach(([name, polys]) => {
                const visible = !!filterVisible[name];
                polys.forEach(p => {
                    try { p.setOptions({ visible: visible }); } catch(e) {}
                });
            });
        }

        // ============================================================
        // 初始化应用
        // ============================================================

        // ============================================================
        // 初始化高德地图
        // ============================================================
        function initMap() {
            return new Promise((resolve, reject) => {
                AMapLoader.load({
                    key: '3ed9efab30dddbd5767f7e3bba9c6cdf',
                    version: '2.0',
                    plugins: ['AMap.Scale', 'AMap.ToolBar', 'AMap.MapType', 'AMap.Geocoder', 'AMap.InfoWindow'],
                    AMapUI: {
                        version: '1.1',
                        plugins: []
                    }
                }).then((AMap) => {
                    const guangningCenter = [112.332, 23.695];

                    map = new AMap.Map('map', {
                        zoom: 15,
                        center: guangningCenter,
                        viewMode: '3D',
                        pitch: 45,
                        rotation: 0,
                        mapStyle: 'amap://styles/dark',
                        showBuildingBlock: true,
                        showLabel: true,
                        jogEnable: true,
                        resizeEnable: true
                    });

                    try {
                        const satellite = new AMap.TileLayer.Satellite({ zIndex: 10 });
                        map.add(satellite);
                    } catch(e) { console.warn('Satellite layer failed:', e); }
                    try {
                        const roadNet = new AMap.TileLayer.RoadNet({ zIndex: 11, opacity: 0.6 });
                        map.add(roadNet);
                    } catch(e) { console.warn('RoadNet layer failed:', e); }

                    map.addControl(new AMap.Scale({ position: 'LB' }));
                    map.addControl(new AMap.ToolBar({ position: 'RB', offset: [20, 80] }));
                    map.addControl(new AMap.MapType({ defaultType: 1, showRoad: true, showTraffic: false }));

                    // Buildings disabled (plugin issue)

                    resolve();
                }).catch(reject);
            });
        }

        async function initApp() {
            try {
                                await initMap();
                
                const { groups, nameList, nameColors } = buildFenceGroups();
                globalNameColors = nameColors;
                
                renderFences(groups, nameColors);
                                renderProjectFilter(nameList, groups, nameColors);
                
                initDashboard(groups, nameList, nameColors);
                                initSearch(groups);
                                initEvents();
                                hideLoading();
                
                // 移动端视野变化重绘
                if (window.innerWidth <= 768) {
                    setupMobileViewRefresh(groups, nameColors);
                }
            } catch (error) {
                const errMsg = error && error.message ? error.message : (typeof error === 'string' ? error : JSON.stringify(error));
                console.error('初始化失败:', errMsg, error);
                const lt = document.querySelector('.loading-text');
                if (lt) lt.textContent = '地图加载失败，请检查高德地图 Key 配置';
            }
        }

        // ============================================================
        // 初始化数据看板
        // ============================================================
        function initDashboard(groups, nameList, nameColors) {
            // 统计数据
            let totalCount = 0;
            let totalArea = 0;
            const nameStats = [];

            nameList.forEach(name => {
                const fences = groups[name];
                const cnt = fences.length;
                const area = fences.reduce((s, f) => s + f.area_m2, 0);
                totalCount += cnt;
                totalArea += area;
                nameStats.push({ name, cnt, area, color: nameColors[name] });
            });

            // 更新统计卡片
            document.getElementById('totalProjects').textContent = totalCount;
            document.getElementById('totalInvestment').textContent = nameList.length; // 显示项目种类数
            document.getElementById('totalArea').textContent = (totalArea / 666.67 / 10000).toFixed(2) + '万亩';
            document.getElementById('totalTowns').textContent = 1;

            // 隐藏旧的镇列表（只有古水镇一个），但保留区域
            const townList = document.getElementById('townList');
            if (townList) {
                townList.innerHTML = `<div class="town-item"><span class="town-name">古水镇（全域）</span><span class="town-count">${totalCount} 个地块 · ${(totalArea/666.67/10000).toFixed(2)} 万亩</span></div>`;
            }

            // 项目名称分类饼图
            initNamePieChart(nameStats);
        }

        // ============================================================
        // 项目名称分布饼图（替代旧的 typeChart 和 townChart）
        // ============================================================
        function initNamePieChart(nameStats) {
            // 只保留 typeChart 的 id，隐藏 townChart
            const typeChartDom = document.getElementById('typeChart');
            const townChartDom = document.getElementById('townChart');
            if (townChartDom) townChartDom.style.display = 'none';

            if (!window.echarts) return;
            typeChart = echarts.init(typeChartDom);

            // 按数量排序，取前 10 个 + "其他"
            const sorted = [...nameStats].sort((a, b) => b.cnt - a.cnt);
            let displayData;
            if (sorted.length <= 10) {
                displayData = sorted;
            } else {
                const top = sorted.slice(0, 10);
                const rest = sorted.slice(10);
                top.push({
                    name: '其他',
                    cnt: rest.reduce((s, x) => s + x.cnt, 0),
                    area: rest.reduce((s, x) => s + x.area, 0),
                    color: '#666666'
                });
                displayData = top;
            }

            const colors = displayData.map(d => d.color);
            const chartData = displayData.map(d => ({ name: d.name, value: d.cnt }));

            const option = {
                backgroundColor: 'transparent',
                title: {
                    text: '项目名称分类统计',
                    left: 'center',
                    top: 8,
                    textStyle: {
                        color: '#e8f4f8',
                        fontSize: 13,
                        fontWeight: 600
                    }
                },
                tooltip: {
                    trigger: 'item',
                    backgroundColor: 'rgba(8, 16, 28, 0.95)',
                    borderColor: 'rgba(0, 212, 255, 0.3)',
                    textStyle: { color: '#e8f4f8', fontSize: 12 },
                    formatter: (p) => {
                        const item = displayData[p.dataIndex];
                        return `<b>${p.name}</b><br/>地块数：${item.cnt}<br/>面积：${formatAreaCompact(item.area)}`;
                    }
                },
                legend: {
                    bottom: 6,
                    textStyle: { color: '#8ba3b5', fontSize: 10 },
                    itemWidth: 10,
                    itemHeight: 10,
                    type: 'scroll'
                },
                series: [{
                    type: 'pie',
                    radius: ['35%', '60%'],
                    center: ['50%', '48%'],
                    data: chartData,
                    color: colors,
                    label: {
                        color: '#8ba3b5',
                        fontSize: 10,
                        formatter: '{b}\n{c}块'
                    },
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 20,
                            shadowOffsetX: 0,
                            shadowColor: 'rgba(0, 212, 255, 0.5)'
                        }
                    }
                }]
            };

            typeChart.setOption(option);
        }

        // ============================================================
        // 初始化搜索（基于项目名称和地块中心）
        // ============================================================
        function initSearch(groups) {
            const searchInput = document.getElementById('searchInput');
            const searchResults = document.getElementById('searchResults');

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim().toLowerCase();
                if (!query) {
                    searchResults.classList.remove('active');
                    return;
                }

                const allFences = ALL_FENCES;
                const results = allFences.filter(f =>
                    f.name.toLowerCase().includes(query)
                ).slice(0, 20);

                if (results.length === 0) {
                    searchResults.innerHTML = '<div class="search-result-item"><div class="name">未找到匹配项目</div></div>';
                    searchResults.classList.add('active');
                    return;
                }

                const nameGroups = {};
                results.forEach(f => {
                    if (!nameGroups[f.name]) nameGroups[f.name] = [];
                    nameGroups[f.name].push(f);
                });

                searchResults.innerHTML = Object.entries(nameGroups).map(([name, fences]) => `
                    <div class="search-result-item" data-name="${name}">
                        <div class="name">${name}</div>
                        <div class="meta">${fences.length} 个地块（总面积 ${formatAreaCompact(fences.reduce((s,f)=>s+f.area_m2,0))}）</div>
                    </div>
                `).join('');

                searchResults.classList.add('active');

                searchResults.querySelectorAll('.search-result-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const name = item.dataset.name;
                        const groupFences = groups[name];
                        if (groupFences && groupFences.length > 0) {
                            // 找到中心点
                            const lats = groupFences.map(f => f.center[0]);
                            const lngs = groupFences.map(f => f.center[1]);
                            const cLng = lats.reduce((a,b) => a+b, 0) / lats.length;
                            const cLat = lngs.reduce((a,b) => a+b, 0) / lngs.length;

                            // 如果筛选器没勾选，先勾上
                            const cb = document.querySelector(`input[data-filter="${name}"]`);
                            if (cb && !cb.checked) cb.checked = true;
                            filterVisible[name] = true;
                            applyFilterVisibility();

                            map.setCenter([cLng, cLat]);
                            map.setZoom(14);

                            // 高亮第一个围栏
                            const first = groupFences[0];
                            showFenceInfoWindow(first, globalNameColors[name] || '#00d4ff');
                        }
                        searchResults.classList.remove('active');
                        searchInput.value = '';
                    });
                });
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-area')) {
                    searchResults.classList.remove('active');
                }
            });

            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const query = e.target.value.trim().toLowerCase();
                    const match = ALL_FENCES.find(f => f.name.toLowerCase().includes(query));
                    if (match) {
                        map.setCenter(match.center);
                        map.setZoom(15);
                        searchResults.classList.remove('active');
                        searchInput.value = '';
                    }
                }
            });
        }

        // ============================================================
        // 初始化事件监听
        // ============================================================
        function initEvents() {
            // ESC 键关闭 InfoWindow
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (fenceInfoWindow) fenceInfoWindow.close();
                    const dashboard = document.getElementById('dashboard');
                    if (dashboard && dashboard.classList.contains('open')) {
                        dashboard.classList.remove('open');
                        const toggle = document.getElementById('dashboardToggle');
                        if (toggle) toggle.classList.remove('active');
                    }
                }
            });

            document.getElementById('dashboardToggle').addEventListener('click', () => {
                const dashboard = document.getElementById('dashboard');
                dashboard.classList.toggle('open');
                document.getElementById('dashboardToggle').classList.toggle('active');
                if (dashboard.classList.contains('open')) {
                    setTimeout(() => {
                        if (typeChart) typeChart.resize();
                    }, 300);
                }
            });

            document.getElementById('dashboardClose').addEventListener('click', () => {
                document.getElementById('dashboard').classList.remove('open');
                document.getElementById('dashboardToggle').classList.remove('active');
            });

            document.getElementById('resetViewBtn').addEventListener('click', () => {
                map.setCenter([112.332, 23.695]);
                map.setZoom(15);
                map.setPitch(45);
                if (fenceInfoWindow) fenceInfoWindow.close();
            });

            // 窗口大小变化
            window.addEventListener('resize', () => {
                if (typeChart) typeChart.resize();
            });
        }

        // ============================================================
        // 隐藏加载遮罩
        // ============================================================

        // ============================================================
        // 图片大图查看器（Lightbox）
        // ============================================================
        let lightboxImages = [];
        let lightboxIndex = 0;

        function openLightbox(images, startIndex) {
            if (!images || images.length === 0) return;
            lightboxImages = images;
            lightboxIndex = startIndex;
            const lightbox = document.getElementById('imageLightbox');
            const img = document.getElementById('lightboxImage');
            const counter = document.getElementById('lightboxCounter');
            img.src = images[startIndex];
            counter.textContent = `${startIndex + 1} / ${images.length}`;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lightbox = document.getElementById('imageLightbox');
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        function lightboxNavigate(direction) {
            if (lightboxImages.length === 0) return;
            lightboxIndex = (lightboxIndex + direction + lightboxImages.length) % lightboxImages.length;
            const img = document.getElementById('lightboxImage');
            const counter = document.getElementById('lightboxCounter');
            img.src = lightboxImages[lightboxIndex];
            counter.textContent = `${lightboxIndex + 1} / ${lightboxImages.length}`;
        }

        // Lightbox 事件绑定
        document.addEventListener('DOMContentLoaded', () => {
            const lightbox = document.getElementById('imageLightbox');
            if (!lightbox) return;

            document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
            document.getElementById('lightboxPrev').addEventListener('click', (e) => {
                e.stopPropagation();
                lightboxNavigate(-1);
            });
            document.getElementById('lightboxNext').addEventListener('click', (e) => {
                e.stopPropagation();
                lightboxNavigate(1);
            });
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) closeLightbox();
            });
            document.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('active')) return;
                switch(e.key) {
                    case 'Escape': closeLightbox(); break;
                    case 'ArrowLeft': lightboxNavigate(-1); break;
                    case 'ArrowRight': lightboxNavigate(1); break;
                }
            });
        });

        // ============================================================
        // 占位函数（保留兼容，现在不再使用）
        // ============================================================
        function closeDetailPanel() {
            const panel = document.getElementById('detailPanel');
            if (panel) panel.classList.remove('open');
        }

        function hideLoading() {
            const mask = document.getElementById('loadingMask');
            if (!mask) return;
            // Force remove after short delay
            setTimeout(() => {
                mask.classList.add('hidden');
                setTimeout(() => { mask.remove(); }, 500);
            }, 300);
        }

        // ============================================================
        // 启动应用
        // ============================================================
        document.addEventListener('DOMContentLoaded', initApp);

    </script>

    <!-- 图片大图查看器 -->
    <div class="image-lightbox" id="imageLightbox">
        <div class="lightbox-close" id="lightboxClose">&#times;</div>
        <button class="lightbox-nav prev" id="lightboxPrev">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m15 18-6-6 6-6"/>
            </svg>
        </button>
        <img src="" alt="" id="lightboxImage">
        <button class="lightbox-nav next" id="lightboxNext">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m9 18 6-6-6-6"/>
            </svg>
        </button>
        <div class="lightbox-counter" id="lightboxCounter"></div>
    </div>
</body>
</html>
